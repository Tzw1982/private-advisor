name: private_advisor
description: 私人顾问团 —— 本地优先的 AI 专家桌面应用
publish_to: none
version: 1.3.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # 核心领域层（纯 Dart，可独立测试）
  advisor_core:
    path: ../advisor_core

  # 存储层（纯 Dart：SQLite 仓储 + schema + 组装，已迁出 app）
  advisor_storage:
    path: ../advisor_storage

  # 网络（SSE 流式）
  http: ^1.2.2

  # 本地存储：业务关系数据（raw SQL，DDL 见 advisor_storage/lib/src/database/schema.sql）
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24

  # Secret：只存 API Key 明文，不进 SQLite
  flutter_secure_storage: ^9.2.2

  # 路径
  path_provider: ^2.1.5
  path: ^1.9.0

  # 知识库导入选文件
  file_picker: ^8.1.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # 左上角品牌图标（AppNavRail 用 Image.asset 加载；未声明则必定加载失败，
  # 回退成主色圆 +「私」字——走查反馈：左上角图标不对）。
  assets:
    - assets/app_icon.png
